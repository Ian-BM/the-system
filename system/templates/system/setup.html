{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>The System — Setup</title>
  <link rel="manifest" href="{% static 'system/manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'system/icons/favicon-32.png' %}" sizes="32x32">
  <link rel="icon" href="{% static 'system/icons/favicon-16.png' %}" sizes="16x16">
  <link rel="apple-touch-icon" href="{% static 'system/icons/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The System">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{% static 'system/css/style.css' %}">
</head>
<body>
  <div class="pin-screen">
    <div class="pin-card">
      <div class="pin-logo">The System</div>
      <div class="pin-tagline">CREATE YOUR 4-DIGIT ACCESS PIN</div>

      {% if error %}<div class="pin-error">{{ error }}</div>{% endif %}

      <form method="post">
        {% csrf_token %}
        <input class="pin-input" type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus autocomplete="off" required placeholder="">
        <input class="pin-input" type="password" name="confirm" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required placeholder="">
        <button type="submit" class="btn full">Initialize</button>
      </form>
    </div>
  </div>
  <script src="{% static 'system/js/main.js' %}"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Offline — The System</title>
  <link rel="manifest" href="{% static 'system/manifest.webmanifest' %}">
  <link rel="icon" href="{% static 'system/icons/favicon-32.png' %}" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'system/icons/apple-touch-icon.png' %}">
  <link rel="stylesheet" href="{% static 'system/css/style.css' %}">
</head>
<body>
  <div class="pin-screen">
    <div class="pin-card">
      <div class="pin-logo">The System</div>
      <div class="pin-tagline">CONNECTION LOST</div>
      <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 24px;">
        You're offline. Your quest log needs a connection to sync — reconnect to keep tracking.
      </p>
      <button class="btn full" onclick="window.location.reload()">Retry</button>
    </div>
  </div>
</body>
</html>
